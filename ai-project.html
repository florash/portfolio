<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Assistant</title>
<style>
body { margin:0; font-family: Arial; display:flex; height:100vh;}
.sidebar { width:300px; background:#111; color:white; padding:20px;}
.main { flex:1; padding:20px; background:#f7f7f7;}
.message { background:white; padding:10px; margin:10px 0; border-radius:10px;}
.user { background:#4CAF50; color:white;}
</style>
</head>

<body>

<div class="sidebar">
  <h2>AI Assistant</h2>
  <input id="topic" placeholder="Enter topic..." />
  <button onclick="generate()">Generate</button>
</div>

<div class="main" id="chat"></div>

<script>
function generate() {
  const topic = document.getElementById("topic").value;

  addMessage(topic, "user");

  const reply = "Here is AI content about: " + topic;

  addMessage(reply, "ai");
}

function addMessage(text, type) {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "message " + type;
  div.innerText = text;
  chat.appendChild(div);
}
</script>

</body>
</html>
